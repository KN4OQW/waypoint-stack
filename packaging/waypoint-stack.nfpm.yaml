# nfpm config for the waypoint-stack metapackage. Architecture-independent
# (arch: all): it ships no binaries, only exact-version dependencies on every
# daemon package, so installing one version string pins the whole stack.
#
# Bump this version (and the pinned dependency versions below) whenever any
# daemon package changes — an upstream pin bump or a +wp packaging revision.
#
# The dependency pins carry the daemons' epoch (1:) because an exact-version
# relation must name the whole version, epoch included; dropping it would match
# nothing and make this package uninstallable. This metapackage itself needs no
# epoch — its own version is plain semver and was already ordered.
name: waypoint-stack
arch: all
platform: linux
version: "0.4.0"
section: hamradio
priority: optional
maintainer: "Waypoint <clintchance@gmail.com>"
vendor: Waypoint
homepage: https://github.com/KN4OQW/waypoint-stack
license: GPL-2.0-or-later
description: |
  Waypoint digital voice daemon stack (metapackage).

  Depends on the exact pinned versions of every Waypoint daemon package
  (MMDVM-Host, DMRGateway, the YSF/DG-ID/P25/NXDN gateways and parrots,
  DStarGateway, M17Gateway and the DAPNET paging gateway). Install this to pull
  the whole stack at one known-good version set. Configuration and systemd units
  are rendered and managed by waypointd.
depends:
  - waypoint-mmdvmhost (= 1:0~git20260823.95a8e1d+wp1)
  - waypoint-dmrgateway (= 1:0~git20260406.79edbc4+wp1)
  - waypoint-ysfgateway (= 1:0~git20260410.2b480aa+wp1)
  - waypoint-dgidgateway (= 1:0~git20260410.2b480aa+wp1)
  - waypoint-ysfparrot (= 1:0~git20260410.2b480aa+wp1)
  - waypoint-p25gateway (= 1:0~git20260608.9751c6e+wp1)
  - waypoint-p25parrot (= 1:0~git20260608.9751c6e+wp1)
  - waypoint-nxdngateway (= 1:0~git20260405.18b4e9a+wp1)
  - waypoint-nxdnparrot (= 1:0~git20260405.18b4e9a+wp1)
  - waypoint-dstargateway (= 1:0~git20260404.612f388+wp1)
  - waypoint-m17gateway (= 1:0~git20250709.c72b989+wp1)
  - waypoint-dapnetgateway (= 1:0~git20260323.5527546+wp1)
contents:
  - src: packaging/copyright
    dst: /usr/share/doc/waypoint-stack/copyright
    file_info:
      mode: 0644
