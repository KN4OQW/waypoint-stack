# nfpm config for waypoint-ysfgateway. PKG_ARCH is set in the environment and binaries are staged
# into packaging/staging/ by packaging/build-debs.sh; the
# version is pinned to the upstream commit (see pins.env: YSFCLIENTS_SHA).
name: waypoint-ysfgateway
arch: ${PKG_ARCH}
platform: linux
# Version: 0~git<upstream-date>.<7-sha>+wp<n>, epoch 1. The date makes the version
# ORDERED — a bare sha is not, so with more than one version in the pool apt would
# pick the highest-sorting sha rather than the newest build. The epoch is what
# carries that change: without it a date-prefixed version sorts BELOW the old
# sha-only one whenever the sha began with a letter (dpkg compares the leading
# non-digit run first), and those packages could never upgrade. See README.md,
# "Version convention".
version: "0~git20260410.2b480aa+wp1"
version_schema: none
epoch: "1"
section: hamradio
priority: optional
maintainer: "Waypoint <clintchance@gmail.com>"
vendor: Waypoint
homepage: https://github.com/KN4OQW/waypoint-stack
license: GPL-2.0-or-later
description: |
  System Fusion (C4FM) reflector gateway.

  Connects MMDVM-Host to YSF reflectors. Built from YSFClients. Ships the
  binary only; configuration and systemd units are rendered and managed by
  waypointd.
depends:
  - libc6 (>= 2.34)
  - libgcc-s1 (>= 3.5)
  - libmosquitto1 (>= 1.6)
  - libstdc++6 (>= 11)
contents:
  - src: packaging/staging/YSFGateway
    dst: /usr/bin/YSFGateway
    file_info:
      mode: 0755
  - src: packaging/copyright
    dst: /usr/share/doc/waypoint-ysfgateway/copyright
    file_info:
      mode: 0644
